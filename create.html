<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Forms - Create</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <section>
            <div class="flex">
                <h1 class="flex">Form Details</h1>
                <div>
                    <button onclick="createForm.saveQuestionsToLocalStorage()" id="save">SAVE</button>
                    <button onclick="createForm.cancel()" class="secondary-button" id="cancel">CANCEL</button>
                </div>
            </div>
        </section>

        <section>
            <div class="form-create">
                <div class="form-header">
                    <div class="form-heading">
                        <input type="text" class="form-name-value" value="Untitled form" placeholder="Form Name" />
                    </div>
                    <div class="form-description">
                        <textarea class="form-description-value">Form description</textarea>
                    </div>
                </div>
                <div class="form-addNewQuestion flex">
                    <h2>Add questions</h2> <button onclick="createForm.addNewQuestion()" class="round-button">+</button>
                </div>

                <!-- All the question will be added in this container -->
                <div id="form-container"></div>
            </div>
        </section>
    </div>
</body>

<script type="module" src="dist/forms/create.js"></script>

</html>
